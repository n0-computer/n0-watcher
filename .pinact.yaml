# yaml-language-server: $schema=https://raw.githubusercontent.com/suzuki-shunsuke/pinact/refs/heads/main/json-schema/pinact.json
version: 3

min_age:
  value: 7 # days, matches the dependabot cooldown

# No semver tag upstream to verify the version comment against. Forks
# should be revisited rather than left indefinitely.
rules:
  - ignore: true
    conditions:
      # fork of nttld/setup-ndk, 1 commit ahead ("allow other hosts").
      # Upstream the patch and switch to v1.6.0.
      - expr: |
          ActionName == "arqu/setup-ndk"
  - ignore: true
    conditions:
      # fork of obi1kenobi/cargo-semver-checks-action (now v2.9). Check if the
      # baseline feature landed upstream.
      - expr: |
          ActionName == "n0-computer/cargo-semver-checks-action"
  - min_age: 0
    conditions:
      # v4.0.2+ stops installing the `tools` SDK package, which Google no
      # longer serves. Every older release fails. Remove after 2026-09-24.
      - expr: |
          ActionName == "android-actions/setup-android" && VersionComment == "v4.0.4"
